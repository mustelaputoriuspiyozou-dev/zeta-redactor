<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeta Screenshot Redactor</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#f5f5f7}
*{box-sizing:border-box} body{margin:0;padding:20px} main{max-width:720px;margin:auto}
h1{font-size:24px;margin:0 0 6px}.sub{color:#666;margin:0 0 18px}
.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0000000d}
label{font-weight:700;display:block;margin-bottom:8px}
input[type=text]{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px}
.row{display:flex;gap:8px;margin-top:8px}.row button{flex:0 0 auto}
button{border:0;border-radius:10px;padding:11px 15px;font-size:15px;cursor:pointer;background:#222;color:white}
button.secondary{background:#e9e9ee;color:#222}
.drop{border:2px dashed #bbb;border-radius:14px;padding:30px 15px;text-align:center;color:#666;cursor:pointer}
.drop.drag{border-color:#222;background:#f3f3f3}
#file{display:none}.terms{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.term{background:#eee;border-radius:999px;padding:7px 10px}.term button{background:transparent;color:#555;padding:0 0 0 7px}
canvas{max-width:100%;height:auto;border-radius:10px;display:block;margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#status{margin-top:10px;color:#555;white-space:pre-wrap}.small{font-size:13px;color:#777}
</style>
</head>
<body>
<main>
  <h1>🖤 Zeta Screenshot Redactor</h1>
  <p class="sub">指定した文字列を見つけて、その部分を黒塗りします。</p>

  <section class="card">
    <label for="term">塗りつぶす文字列</label>
    <div class="row">
      <input id="term" type="text" placeholder="例：username_here" autocomplete="off">
      <button id="add">追加</button>
    </div>
    <div id="terms" class="terms"></div>
    <p class="small">複数登録できます。登録した文字列はこの端末のブラウザに保存されます。</p>
  </section>

  <section class="card">
    <label>スクショ</label>
    <div id="drop" class="drop">
      <strong>画像をここにドロップ</strong><br>またはタップして画像を選択
      <input id="file" type="file" accept="image/*">
    </div>
    <div id="status"></div>
    <canvas id="canvas" hidden></canvas>
    <div class="actions">
      <button id="process" hidden>自動で黒塗り</button>
      <button id="save" hidden>画像を保存</button>
      <button id="reset" class="secondary" hidden>やり直す</button>
    </div>
  </section>

  <section class="card">
    <b>※現在の試作版</b>
    <p class="small">OCRエンジンをCDNから読み込む構成です。初回はインターネット接続が必要です。画像そのものはこのページから外部サーバーへ送信しません。</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let terms=JSON.parse(localStorage.getItem("zetaRedactorTerms")||"[]");
let img=null, originalName="screenshot.png";

function renderTerms(){
  $("terms").innerHTML="";
  terms.forEach((t,i)=>{
    const s=document.createElement("span"); s.className="term";
    s.textContent=t;
    const b=document.createElement("button"); b.textContent="×";
    b.onclick=()=>{terms.splice(i,1);saveTerms();renderTerms()};
    s.appendChild(b);$("terms").appendChild(s);
  });
}
function saveTerms(){localStorage.setItem("zetaRedactorTerms",JSON.stringify(terms))}
function addTerm(){
  const t=$("term").value.trim();
  if(t&&!terms.includes(t)){terms.push(t);saveTerms();renderTerms()}
  $("term").value="";
}
$("add").onclick=addTerm;
$("term").addEventListener("keydown",e=>{if(e.key==="Enter")addTerm()});

$("drop").onclick=()=>$("file").click();
$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("drag")};
$("drop").ondragleave=()=>$("drop").classList.remove("drag");
$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("drag");if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])};
$("file").onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0])};

function loadFile(file){
  if(!file.type.startsWith("image/"))return;
  originalName=file.name.replace(/\.[^.]+$/,"")+"_redacted.png";
  const r=new FileReader();
  r.onload=()=>{
    img=new Image();
    img.onload=()=>{
      const c=$("canvas"); c.width=img.naturalWidth;c.height=img.naturalHeight;
      c.getContext("2d").drawImage(img,0,0);
      c.hidden=false;$("process").hidden=false;$("save").hidden=true;$("reset").hidden=false;
      $("status").textContent=`画像読み込み完了：${img.naturalWidth} × ${img.naturalHeight}`;
    };
    img.src=r.result;
  };r.readAsDataURL(file);
}
function norm(s){return s.toLowerCase().replace(/\s+/g,"")}
async function processImage(){
  if(!img)return;
  if(!terms.length){$("status").textContent="先に塗りつぶす文字列を追加してね。";return}
  $("process").disabled=true;$("status").textContent="OCR中… 少し待ってね。";
  try{
    const {data}=await Tesseract.recognize(img,"jpn+eng",{
      logger:m=>{if(m.status==="recognizing text")$("status").textContent=`OCR中… ${Math.round((m.progress||0)*100)}%`}
    });
    const c=$("canvas"),ctx=c.getContext("2d"), boxes=[];
    for(const w of data.words||[]){
      const text=w.text||"";
      const n=norm(text);
      if(terms.some(t=>n.includes(norm(t)) || norm(t).includes(n))){
        boxes.push(w.bbox);
      }
    }
    // Also inspect OCR lines for usernames containing spaces/segments.
    for(const line of data.lines||[]){
      const n=norm(line.text||"");
      if(terms.some(t=>n.includes(norm(t)))){
        boxes.push(line.bbox);
      }
    }
    ctx.fillStyle="#000";
    const pad=Math.max(4,Math.round(Math.min(c.width,c.height)*0.006));
    boxes.forEach(b=>ctx.fillRect(Math.max(0,b.x0-pad),Math.max(0,b.y0-pad),
      Math.min(c.width,b.x1-b.x0+pad*2),Math.min(c.height,b.y1-b.y0+pad*2)));
    $("status").textContent=boxes.length?`黒塗り完了：${boxes.length}箇所`:"指定文字列が見つかりませんでした。";
    $("save").hidden=false;
  }catch(e){$("status").textContent="OCRでエラーが発生しました。\\n"+e}
  $("process").disabled=false;
}
$("process").onclick=processImage;
$("save").onclick=()=>{
  $("canvas").toBlob(blob=>{
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=originalName;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },"image/png");
};
$("reset").onclick=()=>{
  if(img){const c=$("canvas");c.getContext("2d").drawImage(img,0,0)}
  $("status").textContent="元画像に戻しました。";$("save").hidden=true;
};
renderTerms();
</script>
</body>
</html>
