<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>Zeta Screenshot Redactor v2</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 40px}h1{font-size:23px;margin:0 0 5px}.sub{margin:0 0 16px;color:#666}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}label{display:block;font-weight:700;margin-bottom:8px}.row{display:flex;gap:8px}input[type=text]{min-width:0;flex:1;padding:12px;border:1px solid #ccc;border-radius:11px;font-size:16px}button{border:0;border-radius:11px;padding:12px 15px;font-size:15px;font-weight:600;background:#222;color:#fff}button.secondary{background:#e8e8ed;color:#222}button:disabled{opacity:.5}.terms{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.term{display:flex;align-items:center;gap:5px;background:#eee;border-radius:999px;padding:7px 10px}.term button{background:transparent;color:#555;padding:0;font-size:18px;line-height:1}.drop{border:2px dashed #bbb;border-radius:14px;padding:28px 12px;text-align:center;color:#666;cursor:pointer}.drop.drag{background:#f0f0f2;border-color:#222}#file{display:none}canvas{max-width:100%;height:auto;display:block;margin-top:12px;border-radius:10px;background:#111}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#status{margin-top:10px;color:#555;white-space:pre-wrap}.small{font-size:13px;color:#777;line-height:1.5}.ok{color:#16734a!important}.warn{color:#8a5a00!important}</style></head><body><main><h1>🖤 Zeta Screenshot Redactor</h1><p class="sub">指定した文字列だけを探して黒塗りします。</p><section class="card"><label>塗りつぶす文字列</label><div class="row"><input id="term" type="text" placeholder="例：奏斗" autocomplete="off"><button id="add">追加</button></div><div id="terms" class="terms"></div><p class="small">登録内容はこのブラウザ内にだけ保存されます。</p></section><section class="card"><label>① スクショを選ぶ</label><div id="drop" class="drop"><strong>画像をここにドロップ</strong><br>またはタップして写真・ファイルを選択<input id="file" type="file" accept="image/*"></div><div id="status"></div><canvas id="canvas" hidden></canvas><div class="actions"><button id="process" hidden>② 自動で黒塗り</button><button id="save" hidden>③ 写真に保存</button><button id="reset" class="secondary" hidden>元に戻す</button></div></section><section class="card"><b>📱 iPhoneについて</b><p class="small">「写真に保存」を押すと共有シートが開きます。そこで<strong>「画像を保存」</strong>を選ぶとカメラロール（写真）に保存できます。iOSの仕様上、Webページから写真アプリへ完全自動で保存することはできません。</p><p class="small">画像はこのページ内でOCR・黒塗り処理します。画像ファイルをこのツールのサーバーへアップロードする処理はありません。</p></section></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id);let terms=JSON.parse(localStorage.getItem("zetaRedactorTerms")||"[]"),img=null,originalName="screenshot_redacted.png";
function renderTerms(){terms.forEach(()=>{});$("terms").innerHTML="";terms.forEach((t,i)=>{const s=document.createElement("span");s.className="term";const x=document.createElement("span");x.textContent=t;s.appendChild(x);const b=document.createElement("button");b.textContent="×";b.onclick=()=>{terms.splice(i,1);saveTerms();renderTerms()};s.appendChild(b);$("terms").appendChild(s)})}function saveTerms(){localStorage.setItem("zetaRedactorTerms",JSON.stringify(terms))}function addTerm(){const t=$("term").value.trim();if(t&&!terms.includes(t)){terms.push(t);saveTerms();renderTerms()}$("term").value="";$("term").focus()}$("add").onclick=addTerm;$("term").addEventListener("keydown",e=>{if(e.key==="Enter")addTerm()});$("drop").onclick=()=>$("file").click();$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("drag")};$("drop").ondragleave=()=>$("drop").classList.remove("drag");$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("drag");if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])};$("file").onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0])};
function loadFile(file){if(!file.type.startsWith("image/"))return;originalName=(file.name.replace(/\.[^.]+$/,'')||'screenshot')+'_redacted.png';const r=new FileReader();r.onload=()=>{img=new Image();img.onload=()=>{const c=$("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext("2d").drawImage(img,0,0);c.hidden=false;$("process").hidden=false;$("save").hidden=true;$("reset").hidden=false;$("status").className="";$("status").textContent=`画像読み込み完了：${img.naturalWidth} × ${img.naturalHeight}`};img.src=r.result};r.readAsDataURL(file)}
function norm(s){return(s||'').normalize('NFKC').toLowerCase().replace(/[\s\u200b\u200c\u200d]/g,'')}
function boxesFromSymbols(symbols){const usable=(symbols||[]).filter(s=>s&&s.text&&s.bbox),out=[];for(const t0 of terms){const target=norm(t0);if(!target)continue;for(let i=0;i<usable.length;i++){let built='',chosen=[];for(let j=i;j<Math.min(usable.length,i+target.length+16);j++){const ch=norm(usable[j].text);if(!ch)continue;built+=ch;chosen.push(usable[j]);if(built===target){const xs=chosen.flatMap(x=>[x.bbox.x0,x.bbox.x1]),ys=chosen.flatMap(x=>[x.bbox.y0,x.bbox.y1]);out.push({x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)});break}if(!target.startsWith(built)||built.length>=target.length)break}}}return out}
function boxesFromWords(words){const out=[];for(const w of words||[]){const wn=norm(w.text);if(wn&&w.bbox&&terms.some(t=>wn===norm(t)))out.push({x0:w.bbox.x0,x1:w.bbox.x1,y0:w.bbox.y0,y1:w.bbox.y1})}return out}
function mergeBoxes(boxes){const a=[...boxes],m=[];while(a.length){let b=a.shift(),again=true;while(again){again=false;for(let i=a.length-1;i>=0;i--){const q=a[i],ox=Math.max(0,Math.min(b.x1,q.x1)-Math.max(b.x0,q.x0)),oy=Math.max(0,Math.min(b.y1,q.y1)-Math.max(b.y0,q.y0)),near=Math.abs(b.x0-q.x1)<10||Math.abs(q.x0-b.x1)<10||Math.abs(b.y0-q.y1)<8||Math.abs(q.y0-b.y1)<8;if((ox>0&&oy>0)||near){b={x0:Math.min(b.x0,q.x0),y0:Math.min(b.y0,q.y0),x1:Math.max(b.x1,q.x1),y1:Math.max(b.y1,q.y1)};a.splice(i,1);again=true}}}m.push(b)}return m}
async function processImage(){if(!img)return;if(!terms.length){$("status").textContent="先に塗りつぶす文字列を追加してね。";return}$("process").disabled=true;$("status").className="";$("status").textContent="OCR中… 0%";try{const scale=2,oc=document.createElement('canvas');oc.width=img.naturalWidth*scale;oc.height=img.naturalHeight*scale;oc.getContext('2d').drawImage(img,0,0,oc.width,oc.height);const {data}=await Tesseract.recognize(oc,'jpn+eng',{logger:m=>{if(m.status==='recognizing text')$("status").textContent=`OCR中… ${Math.round((m.progress||0)*100)}%`}});let boxes=boxesFromSymbols(data.symbols);if(!boxes.length)boxes=boxesFromWords(data.words);boxes=mergeBoxes(boxes.map(b=>({x0:b.x0/scale,x1:b.x1/scale,y0:b.y0/scale,y1:b.y1/scale})));const c=$("canvas"),ctx=c.getContext('2d');ctx.fillStyle='#000';const pad=Math.max(5,Math.round(Math.min(c.width,c.height)*.008));for(const b of boxes)ctx.fillRect(Math.max(0,Math.floor(b.x0-pad)),Math.max(0,Math.floor(b.y0-pad)),Math.min(c.width,Math.ceil(b.x1-b.x0+pad*2)),Math.min(c.height,Math.ceil(b.y1-b.y0+pad*2)));if(boxes.length){$("status").className='ok';$("status").textContent=`黒塗り完了：${boxes.length}箇所\n※行全体ではなく、文字単位のOCR座標を使用しました。`;$("save").hidden=false}else{$("status").className='warn';$("status").textContent='指定文字列が見つかりませんでした。';$("save").hidden=true}}catch(e){$("status").className='warn';$("status").textContent='OCRでエラーが発生しました。\n'+e}$("process").disabled=false}
async function saveImage(){const c=$("canvas"),blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)return;if(navigator.share&&navigator.canShare){try{const f=new File([blob],originalName,{type:'image/png'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Zeta黒塗り'});return}}catch(e){if(e&&e.name==='AbortError')return}}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=originalName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}$("process").onclick=processImage;$("save").onclick=saveImage;$("reset").onclick=()=>{if(img){const c=$("canvas");c.getContext('2d').drawImage(img,0,0)}$("status").className='';$("status").textContent='元画像に戻しました。';$("save").hidden=true};renderTerms();
</script></body></html>
